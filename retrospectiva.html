<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Retrospectiva Musical 🖤</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Circular', 'Segoe UI', Helvetica, Arial, sans-serif; 
        }
        body, html { 
            background-color: #000; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        
        .story-container { 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            overflow: hidden; 
            background: #121212; 
            display: flex; 
            flex-direction: column; 
        }
        
        /* Marca superior */
        .spotify-header { 
            position: absolute; 
            top: 35px; 
            left: 20px; 
            right: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            z-index: 11; 
            color: rgba(255,255,255,0.7); 
            font-size: 0.8rem; 
            font-weight: bold; 
            letter-spacing: 1.5px; 
            text-transform: uppercase; 
        }
        .spotify-logo-icon { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            color: #fff; 
        }

        /* Barras de progresso estilo Stories */
        .progress-container { 
            position: absolute; 
            top: 15px; 
            left: 15px; 
            right: 15px; 
            display: flex; 
            gap: 4px; 
            z-index: 12; 
        }
        .progress-bar { 
            height: 3px; 
            background: rgba(255, 255, 255, 0.2); 
            flex: 1; 
            border-radius: 1px; 
            overflow: hidden; 
        }
        .progress-fill { 
            height: 100%; 
            background: #fff; 
            width: 0%; 
        }
        
        /* Slides de Conteúdo */
        .slides { 
            width: 100%; 
            height: 100%; 
            position: relative; 
        }
        .slide { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            opacity: 0; 
            transition: opacity 0.3s ease-in-out; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start; 
            padding: 100px 25px 160px 25px; 
            color: #000; 
            z-index: 1; 
        }
        .slide.active { 
            opacity: 1; 
            z-index: 2; 
        }
        
        /* Cores temáticas do Spotify Wrapped */
        .slide-1 { background-color: #1ed760; color: #000000; }
        .slide-2 { background-color: #ff4632; color: #ffffff; }
        .slide-3 { background-color: #7d4bfa; color: #ffffff; }
        
        .slide h2 { 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 25px; 
            opacity: 0.9; 
            font-weight: 700; 
        }
        .slide h1 { 
            font-size: 3rem; 
            font-weight: 900; 
            line-height: 1.1; 
            letter-spacing: -1.5px; 
            margin-bottom: 20px; 
        }
        .slide p { 
            font-size: 1.4rem; 
            line-height: 1.4; 
            font-weight: 500; 
            max-width: 90%; 
        }
        
        .number-badge { 
            font-size: 5rem; 
            font-weight: 900; 
            line-height: 1; 
            margin: 30px 0 10px 0; 
            letter-spacing: -3px; 
            display: block; 
        }
        .sub-text { 
            font-size: 1.1rem; 
            opacity: 0.85; 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        
        /* Player Widget inferior */
        .spotify-player-widget { 
            position: absolute; 
            bottom: 40px; 
            left: 20px; 
            right: 20px; 
            background: rgba(0, 0, 0, 0.85); 
            padding: 15px; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            z-index: 10; 
            color: #fff; 
            backdrop-filter: blur(10px); 
            box-shadow: 0 8px 24px rgba(0,0,0,0.3); 
            border: 1px solid rgba(255,255,255,0.08); 
        }
        .album-cover { 
            width: 48px; 
            height: 48px; 
            background: linear-gradient(45deg, #7d4bfa, #1ed760); 
            border-radius: 6px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 1.4rem; 
        }
        .track-info { 
            flex: 1; 
            min-width: 0; 
        }
        .track-name { 
            font-size: 0.95rem; 
            font-weight: bold; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .artist-name { 
            font-size: 0.8rem; 
            color: #b3b3b3; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            margin-top: 2px; 
        }
        .player-bar { 
            position: absolute; 
            bottom: 0; 
            left: 15px; 
            right: 15px; 
            height: 3px; 
            background: rgba(255,255,255,0.2); 
            border-radius: 2px; 
            overflow: hidden; 
        }
        .player-progress { 
            width: 0%; 
            height: 100%; 
            background: #1ed760; 
        }

        /* Toques laterais invisíveis para navegação */
        .touch-areas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 8; 
            display: flex; 
        }
        .touch-left { 
            height: 100%; 
            width: 30%; 
            -webkit-tap-highlight-color: transparent; 
        }
        .touch-right { 
            height: 100%; 
            width: 70%; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        /* Tela inicial do app */
        .start-screen { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #000000; 
            z-index: 20; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            color: #fff; 
            padding: 40px; 
            text-align: center; 
        }
        .start-logo { 
            width: 64px; 
            height: 64px; 
            fill: #1ed760; 
            margin-bottom: 30px; 
        }
        .start-screen h3 { 
            font-size: 2rem; 
            font-weight: 900; 
            margin-bottom: 10px; 
            letter-spacing: -0.5px; 
        }
        .start-screen p { 
            color: #a7a7a7; 
            font-size: 1.1rem; 
            margin-bottom: 40px; 
        }
        .start-btn { 
            background: #1ed760; 
            color: #000; 
            border: none; 
            padding: 16px 36px; 
            font-size: 1.1rem; 
            font-weight: bold; 
            border-radius: 30px; 
            cursor: pointer; 
            transition: transform 0.2s; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
    </style>
</head>
<body>

    <div class="story-container">
        <!-- Tela de Abertura -->
        <div class="start-screen" id="startScreen">
            <svg class="start-logo" viewBox="0 0 24 24">
                <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424c-.18.295-.565.387-.86.207-2.377-1.454-5.37-1.783-8.892-.982-.336.075-.668-.135-.745-.47-.077-.337.135-.668.47-.745 3.856-.88 7.15-.51 9.822 1.128.296.18.387.563.205.862zm1.225-2.72c-.227.367-.707.487-1.074.26-2.72-1.672-6.87-2.157-10.073-1.185-.413.125-.847-.107-.973-.52a.792.792 0 0 1 .52-.974c3.66-1.11 8.225-.575 11.34 1.343.366.226.486.706.26 1.075zm.105-2.833C14.383 8.8 8.44 8.603 5.004 9.645a1 1 0 1 1-.578-1.916c3.946-1.198 10.512-.973 14.604 1.456a1 1 0 1 1-1.015 1.728z"/>
            </svg>
            <h3 id="lblTituloEntrada">Seu Wrapped está pronto</h3>
            <p>Uma retrospectiva personalizada da história de vocês dois.</p>
            <button class="start-btn" onclick="startWrapped()">Mergulhar nela</button>
        </div>

        <!-- Progresso superior -->
        <div class="progress-container" id="progressContainer"></div>

        <!-- Cabeçalho -->
        <div class="spotify-header">
            <div class="spotify-logo-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424c-.18.295-.565.387-.86.207-2.377-1.454-5.37-1.783-8.892-.982-.336.075-.668-.135-.745-.47-.077-.337.135-.668.47-.745 3.856-.88 7.15-.51 9.822 1.128.296.18.387.563.205.862zm1.225-2.72c-.227.367-.707.487-1.074.26-2.72-1.672-6.87-2.157-10.073-1.185-.413.125-.847-.107-.973-.52a.792.792 0 0 1 .52-.974c3.66-1.11 8.225-.575 11.34 1.343.366.226.486.706.26 1.075zm.105-2.833C14.383 8.8 8.44 8.603 5.004 9.645a1 1 0 1 1-.578-1.916c3.946-1.198 10.512-.973 14.604 1.456a1 1 0 1 1-1.015 1.728z"/></svg>
                <span>Wrapped</span>
            </div>
            <div id="anoAtual">2026</div>
        </div>

        <div class="touch-areas">
            <div class="touch-left" onclick="prevSlide()"></div>
